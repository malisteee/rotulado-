# Supabase (plan gratis) pausa el proyecto tras 7 días sin uso.
# Esta tarea automática de GitHub le hace una consulta cada 3 días para mantenerlo activo.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        run: |
          URL=$(grep -oP 'SUPABASE_URL = "\K[^"]+' <(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/config.js"))
          KEY=$(grep -oP 'SUPABASE_ANON_KEY = "\K[^"]+' <(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/config.js"))
          curl -fsS "$URL/rest/v1/decks?select=id&limit=1" -H "apikey: $KEY" -o /dev/null -w "Supabase respondió %{http_code}\n"
